[theme]
primaryColor = "#ff3366"
backgroundColor = "#08070e"
secondaryBackgroundColor = "#120d20"
textColor = "#f1f5f9"
font = "sans serif"

[server]
headless = true
enableCORS = true
enableXsrfProtection = false
maxUploadSize = 200
healthCheckInterval = 30
port = 5000
address = "0.0.0.0"

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
